name: KasihKirim Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KasihKirimAndroid/**'
      - '.github/workflows/android-cloud-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'KasihKirimAndroid/**'
      - '.github/workflows/android-cloud-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.6.0'
  ANDROID_PLATFORM: 'android-37'
  BUILD_TOOLS: '37.0.0'

jobs:
  build:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The action's own default `packages` input is 'tools platform-tools'.
      # Google has removed the legacy 'tools' package from the SDK
      # repository manifest, so sdkmanager now fails outright trying to
      # install it ("Warning: Failed to find package 'tools'" -> non-zero
      # exit), taking down this whole step before any of our own SDK setup
      # even runs. platform-tools is the only package actually used from
      # this step (the next steps below install a fresh cmdline-tools
      # release and the real platform/build-tools packages), so drop
      # 'tools' from the request rather than accept the action's default.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # android-actions/setup-android@v3 bundles an old cmdline-tools release
      # that only understands SDK XML schema up to version 3, so it can't
      # see packages (like platforms;android-37) published under a newer
      # schema -- it fetches the repository index fine and just silently
      # fails to match the entry. Install a current cmdline-tools release
      # and use that sdkmanager for everything else. The old tools already
      # occupy cmdline-tools/latest, so clear that path first -- otherwise
      # sdkmanager installs the new release into a sibling directory
      # (cmdline-tools/latest-2) instead of the path we then put on PATH.
      #
      # The bundled version number itself isn't pinned by the action -- it
      # tracks whatever GitHub's runner image ships, which has drifted from
      # 16.0 to 20.0 under us without any workflow change on our side
      # (confirmed via CI logs of Dependabot PRs #18/#21). Discover the
      # actual directory instead of hardcoding one.
      - name: Update Android cmdline-tools
        run: |
          set -euo pipefail
          bundled_tools="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest | sort -V | tail -1)"
          if [ -z "$bundled_tools" ]; then
            echo "::error::No bundled cmdline-tools directory found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using bundled cmdline-tools: $bundled_tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$bundled_tools/bin/sdkmanager" --licenses >/dev/null || true
          "$bundled_tools/bin/sdkmanager" "cmdline-tools;latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # android-37 / build-tools 37.0.0 (Android 17) are pre-release: the
      # latest platform published to the stable channel is still API 36
      # (https://developer.android.com/tools/releases/platforms), so this
      # pin only resolves from the canary channel. --channel=3 is
      # cumulative (stable+beta+dev+canary), so this keeps working once
      # android-37 reaches stable too.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses --channel=3 >/dev/null || true
          sdkmanager --channel=3 "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        working-directory: KasihKirimAndroid
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      # Fork pull requests never see repository secrets -- GitHub withholds
      # them from workflows triggered by a pull_request event from a fork,
      # by design, to stop a fork from exfiltrating secrets via a crafted
      # workflow change. That means this step fails closed for fork PRs
      # rather than silently building with an empty Supabase config.
      #
      # Dependabot-authored PRs hit the same empty-secrets situation even
      # though their branch lives in this repository, not a fork: GitHub
      # separately withholds repository secrets from pull_request runs
      # triggered by dependabot[bot] unless the same values are also stored
      # as distinct "Dependabot secrets" (Settings -> Secrets and variables
      # -> Dependabot). Confirmed via PR #22/#23's job logs: IS_FORK_PR was
      # false but SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY were still empty. A
      # version-bump PR only needs to prove the bump still compiles and
      # passes the JVM unit tests -- which run against fakes and never call
      # real Supabase (this codebase's established test discipline) -- so a
      # harmless placeholder is enough for an accurate signal here, without
      # this workflow ever handling the real secret on Dependabot's behalf.
      # Fork PRs above are unaffected and still fail closed.
      - name: Configure Supabase build values
        working-directory: KasihKirimAndroid
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            if [ "$IS_DEPENDABOT_PR" = "true" ]; then
              echo "::notice::Dependabot PRs don't receive repository secrets (a GitHub restriction, not a misconfiguration). Using placeholder Supabase values so the dependency bump can still be compiled and unit-tested -- this build's APK is not a representative config."
              SUPABASE_URL="https://placeholder.supabase.co"
              SUPABASE_PUBLISHABLE_KEY="placeholder-publishable-key"
            elif [ "$IS_FORK_PR" = "true" ]; then
              echo "::error::Missing SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY secret."
              echo "::error::This build was triggered by a pull request from a fork. GitHub does not expose repository secrets (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) to workflows run for fork pull requests -- this is a GitHub security restriction, not a misconfiguration, and it cannot be worked around from within the workflow. A maintainer must build this change from a branch on the base repository (or via workflow_dispatch) instead."
              exit 1
            else
              echo "::error::Missing SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY secret."
              echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY under Settings -> Secrets and variables -> Actions for this repository."
              exit 1
            fi
          fi
          printf 'sdk.dir=%s\nSUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$ANDROID_HOME" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties

      # Added with the Phase 1 foundation. A service_role key or DB password in
      # the client is a total compromise: it bypasses RLS on every table. Fail
      # the build rather than let one reach an APK.
      - name: GATE — no forbidden secret in Android sources
        run: |
          set -euo pipefail
          fail=0
          # Match KEY MATERIAL, not the words. An earlier version of this gate
          # grepped for the bare string 'service_role', which appears in the
          # comment in SupabaseClientProvider.kt explaining why it must never
          # be used -- and so failed the build it was meant to protect.
          # Comment lines are stripped before matching.
          if grep -rIn --include='*.kt' --include='*.kts' --include='*.xml' -E \
               -e 'sb_secret_[A-Za-z0-9_-]+' \
               -e 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' \
               -e '(SERVICE_ROLE|SERVICE_KEY)[A-Z_]*\s*[:=]\s*["'"'"'][^"'"'"']+' \
               -e 'postgres(ql)?://[^\s"]+' \
               KasihKirimAndroid/ | grep -vE '^\S+:[0-9]+:\s*(//|\*|#|<!--)' ; then
            echo "::error::key material found in Android sources"; fail=1
          fi
          if git ls-files --error-unmatch KasihKirimAndroid/local.properties >/dev/null 2>&1; then
            echo "::error::local.properties is tracked"; fail=1
          fi
          exit $fail

      - name: Run JVM tests
        working-directory: KasihKirimAndroid
        run: ./gradlew test --no-daemon

      - name: Upload JVM test reports (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: KasihKirim-jvm-test-reports
          path: KasihKirimAndroid/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        working-directory: KasihKirimAndroid
        run: ./gradlew :app:assembleDebug --no-daemon

      # Inspect the packaged binary itself, not just the sources.
      - name: GATE — no secret survived into the APK
        run: |
          set -euo pipefail
          APK=$(find KasihKirimAndroid/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::APK not produced"; exit 1; }
          if strings "$APK" | grep -qE 'service_role|sb_secret_|postgres(ql)?://'; then
            echo "::error::secret-shaped string found inside the APK"; exit 1
          fi
          echo "APK OK: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: KasihKirim-debug-apk
          path: KasihKirimAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
