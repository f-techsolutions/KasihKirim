name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    name: Schema + RLS matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with: { version: latest }

      # Applies 0000 -> 0004 + seed from an empty database. Catches ordering
      # bugs, which is the failure mode this project is most exposed to.
      - name: Start stack and apply migrations from zero
        run: |
          supabase start
          supabase db reset --debug

      - name: Install pgTAP test helpers
        run: |
          set -euo pipefail

          DB_URL="$(supabase status --output json | jq -r '.DB_URL // .db.url // empty')"

          if [ -z "$DB_URL" ]; then
            echo "::error::Could not determine local Supabase DB URL"
            echo "Supabase status output:"
            supabase status --output json
            exit 1
          fi

          echo "Installing pgTAP test helpers into local database..."
          psql "$DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/test_helpers/00_helpers.sql

      # See kasihkirim-verification.yml's own "GATE — supabase test db" step
      # for why this retries: pg_prove runs in a short-lived Docker
      # container the Supabase CLI pulls fresh every time, and an
      # anonymous-pull registry rate limit there is infra flakiness, not a
      # test failure (confirmed via Dependabot PR #13's own CI log).
      - name: pgTAP
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          while true; do
            if supabase test db 2>&1 | tee pgtap.log; then
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ] && grep -q "toomanyrequests" pgtap.log; then
              attempt=$((attempt + 1))
              echo "::warning::Docker registry rate-limited the pg_prove pull -- retrying ($attempt/$max_attempts)"
              sleep $((attempt * 15))
              continue
            fi
            exit 1
          done

      # A table without policies is a data breach waiting to happen, so an
      # unprotected table fails the build rather than shipping.
      - name: Every public application table has RLS
        run: |
          set -euo pipefail

          DB_URL="$(supabase status --output json | jq -r '.DB_URL // .db.url // empty')"

          if [ -z "$DB_URL" ]; then
            echo "::error::Could not determine local Supabase DB URL"
            echo "Supabase status output:"
            supabase status --output json
            exit 1
          fi

          psql "$DB_URL" \
            -v ON_ERROR_STOP=1 \
            <<'SQL'
          DO $$
          DECLARE bad TEXT;
          BEGIN
            SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
              INTO bad
            FROM pg_class c
            JOIN pg_namespace n
              ON n.oid = c.relnamespace
            LEFT JOIN pg_depend d
              ON d.classid = 'pg_class'::regclass
             AND d.objid = c.oid
             AND d.deptype = 'e'
            LEFT JOIN pg_extension e
              ON e.oid = d.refobjid
            WHERE n.nspname = 'public'
              AND c.relkind = 'r'
              AND e.oid IS NULL
              AND NOT c.relrowsecurity;

            IF bad IS NOT NULL THEN
              RAISE EXCEPTION 'Application tables without RLS: %', bad;
            END IF;
          END $$;
          SQL

      # Bare auth.uid() re-evaluates per row and turns an index seek into a
      # sequential scan. See SECURITY.md 4.2.
      - name: No bare auth.uid() in policies
        run: |
          set -euo pipefail

          python3 <<'PY'
          import pathlib
          import re
          import sys

          policy_start = re.compile(r'CREATE\s+POLICY\b', re.IGNORECASE)

          bare_uid = re.compile(
              r'(?<!SELECT\s)(?<!SELECT\s\()auth\.uid\(\)',
              re.IGNORECASE
          )

          def statement_end(text, start):
              """Index just past the semicolon that ends the statement
              beginning at `start`, tracking paren depth so a `;` nested
              inside a function body (e.g. a policy calling a PL/pgSQL
              helper) doesn't end it early. Falls back to end-of-text if
              no top-level `;` is found."""
              depth = 0
              i = start
              while i < len(text):
                  ch = text[i]
                  if ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                  elif ch == ';' and depth <= 0:
                      return i + 1
                  i += 1
              return len(text)

          failures = []

          for path in sorted(pathlib.Path("supabase/migrations").glob("*.sql")):
              text = path.read_text(encoding="utf-8")

              # Remove SQL comments before checking policy expressions.
              text = re.sub(r'--[^\n]*', '', text)
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.DOTALL)

              for match in policy_start.finditer(text):
                  end = statement_end(text, match.start())
                  block = text[match.start():end]

                  if bare_uid.search(block):
                      start_line = text[:match.start()].count("\n") + 1
                      name_match = re.search(
                          r'CREATE\s+POLICY\s+([A-Za-z0-9_]+)',
                          block,
                          re.IGNORECASE
                      )
                      policy_name = (
                          name_match.group(1)
                          if name_match else "<unknown>"
                      )

                      failures.append(
                          f"{path}:{start_line}: {policy_name}"
                      )

          if failures:
              print("Policies containing bare auth.uid():")
              for failure in failures:
                  print(f"  {failure}")
              print()
              print("Policies must use (SELECT auth.uid())")
              sys.exit(1)

          print("All RLS policies use (SELECT auth.uid())")
          PY

      - name: internal and audit are not exposed via PostgREST
        run: |
          grep -q 'schemas = \["public", "graphql_public"\]' supabase/config.toml \
            || { echo "config.toml exposes extra schemas"; exit 1; }

  mobile:
    name: Typecheck + size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile

      # iOS is out of scope. An accidental iOS target is a scope leak.
      - name: No iOS targets
        run: |
          if [ -d apps/mobile/ios ] || grep -q '"ios"' apps/mobile/app.json; then
            echo "iOS is out of scope"; exit 1
          fi

  security:
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Service role key never in client code
        run: |
          if grep -rn "SUPABASE_SERVICE_ROLE" apps/mobile/src apps/mobile/app 2>/dev/null; then
            echo "service_role key referenced in client code"
            exit 1
          fi
